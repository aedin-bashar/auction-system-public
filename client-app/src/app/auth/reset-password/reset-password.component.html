<section class="reset-password">
  <header class="reset-password__header">
    <h1>Set a New Password</h1>
    <p>Choose a new password for your Auction System account.</p>
  </header>

  <form class="reset-password__form" [formGroup]="form" (ngSubmit)="submit()">
    <p class="reset-password__error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="reset-password__field">
      <label for="newPassword">New Password</label>
      <div class="reset-password__password-control">
        <input
          id="newPassword"
          [type]="showNewPassword ? 'text' : 'password'"
          formControlName="newPassword"
          placeholder="New password"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="reset-password__visibility-toggle"
          (click)="toggleNewPasswordVisibility()"
          [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'"
          [attr.aria-pressed]="showNewPassword"
          [title]="showNewPassword ? 'Hide new password' : 'Show new password'"
        >
          <i class="fa-solid" [class.fa-eye]="!showNewPassword" [class.fa-eye-slash]="showNewPassword" aria-hidden="true"></i>
        </button>
      </div>
      <small *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.hasError('required')">
        New password is required.
      </small>
      <small *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.hasError('minlength')">
        Use at least 6 characters.
      </small>
    </div>

    <div class="reset-password__field" [class.reset-password__field--error]="form.errors?.['passwordMismatch']">
      <label for="confirmNewPassword">Confirm New Password</label>
      <div class="reset-password__password-control">
        <input
          id="confirmNewPassword"
          [type]="showConfirmNewPassword ? 'text' : 'password'"
          formControlName="confirmNewPassword"
          placeholder="Confirm new password"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="reset-password__visibility-toggle"
          (click)="toggleConfirmNewPasswordVisibility()"
          [attr.aria-label]="showConfirmNewPassword ? 'Hide confirm new password' : 'Show confirm new password'"
          [attr.aria-pressed]="showConfirmNewPassword"
          [title]="showConfirmNewPassword ? 'Hide confirm new password' : 'Show confirm new password'"
        >
          <i class="fa-solid" [class.fa-eye]="!showConfirmNewPassword" [class.fa-eye-slash]="showConfirmNewPassword" aria-hidden="true"></i>
        </button>
      </div>
      <small *ngIf="form.get('confirmNewPassword')?.touched && form.get('confirmNewPassword')?.hasError('required')">
        Confirm your password.
      </small>
      <p class="reset-password__mismatch-error" *ngIf="form.get('confirmNewPassword')?.touched && form.errors?.['passwordMismatch']">
        Passwords do not match.
      </p>
    </div>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Setting password...' : 'Set New Password' }}
    </button>
  </form>

  <p class="reset-password__footer">
    <a class="reset-password__link" routerLink="/forgot-password">Request a new reset link</a>
  </p>
</section>
