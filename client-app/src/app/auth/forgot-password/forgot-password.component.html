<section class="forgot-password">
  <header class="forgot-password__header">
    <h1>Forgot Your Password?</h1>
    <p>Enter your email and we'll send you a reset link.</p>
  </header>

  <div *ngIf="submitted; else formBlock">
    <p class="forgot-password__message forgot-password__message--success">
      If an account with that email exists, a reset link has been sent. Check your inbox.
    </p>
    <a class="forgot-password__back-link" routerLink="/login">Back to Sign In</a>
  </div>

  <ng-template #formBlock>
    <form class="forgot-password__form" [formGroup]="form" (ngSubmit)="submit()">
      <p class="forgot-password__error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="forgot-password__field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
          inputmode="email"
        />
        <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Enter a valid email address.
        </small>
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <p class="forgot-password__footer">
      Remembered it?
      <a class="forgot-password__link" routerLink="/login">Sign in</a>
    </p>
  </ng-template>
</section>
