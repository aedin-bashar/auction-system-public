<section class="theme-toggle" [class.theme-toggle--compact]="compact" aria-label="Color theme">
  <p class="theme-toggle__label" *ngIf="!compact">Theme</p>

  <div class="theme-toggle__options" role="group" aria-label="Choose color theme">
    <button
      type="button"
      class="theme-toggle__option"
      [class.theme-toggle__option--active]="theme() === 'light'"
      [attr.aria-pressed]="theme() === 'light'"
      (click)="setTheme('light')"
    >
      <i class="fa-regular fa-sun" aria-hidden="true"></i>
      <span>Light</span>
    </button>

    <button
      type="button"
      class="theme-toggle__option"
      [class.theme-toggle__option--active]="theme() === 'dark'"
      [attr.aria-pressed]="theme() === 'dark'"
      (click)="setTheme('dark')"
    >
      <i class="fa-regular fa-moon" aria-hidden="true"></i>
      <span>Dark</span>
    </button>
  </div>
</section>
