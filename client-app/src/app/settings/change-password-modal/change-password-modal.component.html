<div class="change-password-modal" *ngIf="open" (click)="onBackdropClick()">
  <div
    class="change-password-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="change-password-modal-title"
    aria-describedby="change-password-modal-desc"
    (click)="onDialogClick($event)"
  >
    <p class="change-password-modal__kicker">Settings</p>
    <h2 id="change-password-modal-title" class="change-password-modal__title">Change Password</h2>
    <p id="change-password-modal-desc" class="change-password-modal__desc">
      Update your account password to keep your profile secure.
    </p>

    <div class="change-password-modal__field">
      <label for="currentPassword">Current Password</label>
      <div class="change-password-modal__password-control">
        <input
          id="currentPassword"
          [type]="showCurrentPassword ? 'text' : 'password'"
          [(ngModel)]="currentPassword"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="change-password-modal__visibility-toggle"
          (click)="toggleCurrentPasswordVisibility()"
          [attr.aria-label]="showCurrentPassword ? 'Hide current password' : 'Show current password'"
          [attr.aria-pressed]="showCurrentPassword"
          [title]="showCurrentPassword ? 'Hide current password' : 'Show current password'"
        >
          <i class="fa-solid" [class.fa-eye]="!showCurrentPassword" [class.fa-eye-slash]="showCurrentPassword" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="change-password-modal__field">
      <label for="changeNewPassword">New Password</label>
      <div class="change-password-modal__password-control">
        <input
          id="changeNewPassword"
          [type]="showNewPassword ? 'text' : 'password'"
          [(ngModel)]="newPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="change-password-modal__visibility-toggle"
          (click)="toggleNewPasswordVisibility()"
          [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'"
          [attr.aria-pressed]="showNewPassword"
          [title]="showNewPassword ? 'Hide new password' : 'Show new password'"
        >
          <i class="fa-solid" [class.fa-eye]="!showNewPassword" [class.fa-eye-slash]="showNewPassword" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="change-password-modal__field">
      <label for="changeConfirmPassword">Confirm New Password</label>
      <div class="change-password-modal__password-control">
        <input
          id="changeConfirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="change-password-modal__visibility-toggle"
          (click)="toggleConfirmPasswordVisibility()"
          [attr.aria-label]="showConfirmPassword ? 'Hide confirm new password' : 'Show confirm new password'"
          [attr.aria-pressed]="showConfirmPassword"
          [title]="showConfirmPassword ? 'Hide confirm new password' : 'Show confirm new password'"
        >
          <i class="fa-solid" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <p class="change-password-modal__error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="change-password-modal__error" *ngIf="serverError">{{ serverError }}</p>

    <div class="change-password-modal__actions">
      <button
        type="button"
        class="change-password-modal__btn change-password-modal__btn--save"
        [disabled]="busy"
        (click)="save()"
      >
        {{ busy ? 'Saving...' : 'Save Changes' }}
      </button>
      <button
        type="button"
        class="change-password-modal__btn change-password-modal__btn--ghost"
        [disabled]="busy"
        (click)="cancel()"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
