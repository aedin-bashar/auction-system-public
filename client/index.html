<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🏷️ Auction System</h1>
        <nav>
            <a href="index.html">Auctions</a>
            <a href="admin.html">Admin</a>
            <span id="user-info"></span>
        </nav>
    </header>

    <div class="container">
        <div id="message-area"></div>

        <!-- Login Section -->
        <div id="login-section" class="card">
            <h2>Login to Place Bids</h2>
            <div class="two-col">
                <div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="login-username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Enter password">
                    </div>
                    <button class="btn btn-primary" onclick="login()">Login</button>
                    <button class="btn btn-secondary" style="margin-left:0.5rem" onclick="logout()">Logout</button>
                </div>
                <div>
                    <p style="font-size:0.85rem;color:#666;margin-bottom:0.5rem">Don't have an account?</p>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="reg-username" placeholder="Choose username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="Choose password">
                    </div>
                    <button class="btn btn-success" onclick="register()">Register as Bidder</button>
                </div>
            </div>
        </div>

        <!-- Auctions List -->
        <div id="auctions-section">
            <div class="section-header">
                <h2 style="font-size:1.3rem;color:#1a1a2e">Active Auctions</h2>
                <button class="btn btn-secondary btn-sm" onclick="loadAuctions()">↻ Refresh</button>
            </div>
            <div class="auctions-grid" id="auctions-grid">
                <p style="color:#666">Loading auctions...</p>
            </div>
        </div>

        <!-- Auction Detail -->
        <div id="auction-detail" class="card">
            <button class="btn btn-secondary btn-sm" onclick="closeDetail()" style="margin-bottom:1rem">← Back to Auctions</button>
            <div class="two-col">
                <div>
                    <h2 id="detail-title"></h2>
                    <p id="detail-description" style="color:#555;margin:0.5rem 0;font-size:0.9rem"></p>
                    <p style="font-size:0.8rem;color:#888" id="detail-times"></p>
                    <div class="current-price-display" id="detail-price"></div>
                    <span class="realtime-badge" id="signalr-status">Connecting...</span>

                    <div id="bid-form-section" style="margin-top:1rem">
                        <div class="form-group">
                            <label>Your Bid Amount ($)</label>
                            <input type="number" id="bid-amount" placeholder="Enter bid amount" step="0.01">
                        </div>
                        <button class="btn btn-success" onclick="placeBid()">Place Bid</button>
                    </div>
                    <p id="bid-login-msg" style="display:none;color:#888;font-size:0.85rem;margin-top:1rem">Please login to place bids.</p>
                </div>
                <div>
                    <h3 style="margin-bottom:0.8rem;color:#1a1a2e">Bid History</h3>
                    <div class="bid-list" id="bid-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script>
        const API = 'http://localhost:5000';
        let currentAuctionId = null;
        let connection = null;

        function getToken() { return localStorage.getItem('token'); }
        function getUsername() { return localStorage.getItem('username'); }

        function showMessage(msg, type = 'info') {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
            setTimeout(() => area.innerHTML = '', 4000);
        }

        function updateUserInfo() {
            const username = getUsername();
            const info = document.getElementById('user-info');
            if (username) {
                info.textContent = `👤 ${username}`;
            } else {
                info.textContent = '';
            }
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);
                    updateUserInfo();
                    showMessage('Logged in successfully!', 'success');
                    updateBidFormVisibility();
                } else {
                    showMessage('Invalid credentials', 'error');
                }
            } catch (e) {
                showMessage('Connection error. Is the API running?', 'error');
            }
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            try {
                const res = await fetch(`${API}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role: 'Bidder' })
                });
                if (res.ok) {
                    showMessage('Registered successfully! Please login.', 'success');
                } else {
                    const err = await res.text();
                    showMessage(err, 'error');
                }
            } catch (e) {
                showMessage('Connection error', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            updateUserInfo();
            updateBidFormVisibility();
            showMessage('Logged out', 'info');
        }

        function updateBidFormVisibility() {
            const token = getToken();
            document.getElementById('bid-form-section').style.display = token ? 'block' : 'none';
            document.getElementById('bid-login-msg').style.display = token ? 'none' : 'block';
        }

        async function loadAuctions() {
            try {
                const res = await fetch(`${API}/api/auctions`);
                const auctions = await res.json();
                const grid = document.getElementById('auctions-grid');
                if (auctions.length === 0) {
                    grid.innerHTML = '<p style="color:#666">No auctions available.</p>';
                    return;
                }
                grid.innerHTML = auctions.map(a => `
                    <div class="auction-card" onclick="openAuction(${a.id})">
                        <h3>${escHtml(a.title)}</h3>
                        <p style="font-size:0.85rem;color:#555;margin-bottom:0.5rem">${escHtml(a.description)}</p>
                        <div class="price">$${a.currentPrice.toFixed(2)}</div>
                        <span class="status ${a.isActive ? 'active' : 'ended'}">${a.isActive ? 'Active' : 'Ended'}</span>
                        <p class="ends-at">Ends: ${new Date(a.endTime).toLocaleString()}</p>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('auctions-grid').innerHTML = '<p style="color:#c62828">Failed to load auctions. Is the API running on port 5000?</p>';
            }
        }

        async function openAuction(id) {
            currentAuctionId = id;
            document.getElementById('auctions-section').style.display = 'none';
            document.getElementById('auction-detail').style.display = 'block';

            try {
                const res = await fetch(`${API}/api/auctions/${id}`);
                const auction = await res.json();
                document.getElementById('detail-title').textContent = auction.title;
                document.getElementById('detail-description').textContent = auction.description;
                document.getElementById('detail-times').textContent =
                    `Start: ${new Date(auction.startTime).toLocaleString()} | End: ${new Date(auction.endTime).toLocaleString()}`;
                document.getElementById('detail-price').textContent = `Current Price: $${auction.currentPrice.toFixed(2)}`;

                await loadBids(id);
                await connectSignalR(id);
                updateBidFormVisibility();
            } catch (e) {
                showMessage('Failed to load auction details', 'error');
            }
        }

        async function loadBids(auctionId) {
            try {
                const res = await fetch(`${API}/api/auctions/${auctionId}/bids`);
                const bids = await res.json();
                const list = document.getElementById('bid-list');
                if (bids.length === 0) {
                    list.innerHTML = '<p style="color:#888;font-size:0.85rem">No bids yet. Be the first!</p>';
                    return;
                }
                list.innerHTML = bids.sort((a, b) => new Date(b.placedAt) - new Date(a.placedAt)).map(b => `
                    <div class="bid-item">
                        <span class="bid-amount">$${b.amount.toFixed(2)}</span>
                        <span class="bid-user">${escHtml(b.user?.username ?? 'Unknown')}</span>
                        <span class="bid-time">${new Date(b.placedAt).toLocaleTimeString()}</span>
                    </div>
                `).join('');
            } catch (e) {}
        }

        async function placeBid() {
            const amount = parseFloat(document.getElementById('bid-amount').value);
            if (isNaN(amount) || amount <= 0) {
                showMessage('Please enter a valid bid amount', 'error');
                return;
            }
            try {
                const res = await fetch(`${API}/api/auctions/${currentAuctionId}/bids`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ auctionId: currentAuctionId, amount })
                });
                if (res.ok) {
                    showMessage('Bid placed successfully!', 'success');
                    document.getElementById('bid-amount').value = '';
                } else {
                    const err = await res.text();
                    showMessage(err, 'error');
                }
            } catch (e) {
                showMessage('Failed to place bid', 'error');
            }
        }

        async function connectSignalR(auctionId) {
            if (connection) {
                try { await connection.stop(); } catch (e) {}
            }

            const status = document.getElementById('signalr-status');
            status.textContent = 'Connecting...';

            connection = new signalR.HubConnectionBuilder()
                .withUrl(`${API}/hubs/auction`)
                .withAutomaticReconnect()
                .build();

            connection.on('BidUpdate', (id, amount, username) => {
                document.getElementById('detail-price').textContent = `Current Price: $${parseFloat(amount).toFixed(2)}`;
                showMessage(`New bid: $${parseFloat(amount).toFixed(2)} by ${username}`, 'success');
                loadBids(currentAuctionId);
            });

            try {
                await connection.start();
                await connection.invoke('JoinAuctionGroup', auctionId.toString());
                status.textContent = 'Live Updates Active';
            } catch (e) {
                status.textContent = 'Offline';
            }
        }

        function closeDetail() {
            document.getElementById('auction-detail').style.display = 'none';
            document.getElementById('auctions-section').style.display = 'block';
            if (connection) {
                connection.invoke('LeaveAuctionGroup', currentAuctionId?.toString()).catch(() => {});
            }
            currentAuctionId = null;
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(str));
            return d.innerHTML;
        }

        updateUserInfo();
        loadAuctions();
    </script>
</body>
</html>
